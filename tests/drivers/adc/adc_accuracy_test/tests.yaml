common:
  tags:
    - adc
    - drivers
  depends_on:
    - adc
  filter: dt_node_has_prop("/zephyr,user","io-channels")

tests:
  drivers.adc.accuracy.dac_source:
    depends_on:
      - dac
    extra_configs:
      - CONFIG_DAC_SOURCE_TEST=y
    # Test scenario is filtered if Kconfig dependencies are not satisfied
    filter: CONFIG_DAC_SOURCE_TEST
    harness_config:
      fixture: dac_adc_loopback
    platform_allow:
      - frdm_k64f
      - ek_ra8d1
      - ek_ra8m1
      - fpb_ra8e1
      - mck_ra8t1
      - ek_ra6e2
      - ek_ra6m1
      - ek_ra6m2
      - ek_ra6m3
      - ek_ra6m4
      - ek_ra6m5
      - fpb_ra6e1
      - fpb_ra6e2
      - ek_ra4e2
      - ek_ra4l1
      - ek_ra4m1
      - ek_ra4m2
      - ek_ra4m3
      - ek_ra4w1
      - fpb_ra4e1
      - ek_ra2a1
      - ek_ra2l1
      - sam_e54_xpro
      - pic32cx_sg41_cult
      - pic32cx_sg61_cult
  drivers.adc.accuracy.ref_volt:
    extra_configs:
      - CONFIG_REFERENCE_VOLTAGE_TEST=y
    # Test scenario is filtered if Kconfig dependencies are not satisfied
    filter: CONFIG_REFERENCE_VOLTAGE_TEST
    harness_config:
      fixture: adc_ref_volt
    platform_allow:
      - frdm_kl25z
      - frdm_mcxc242
      - frdm_mcxc444
      - nrf52840dk/nrf52840
      - nrf5340dk/nrf5340/cpuapp
      - nrf54h20dk/nrf54h20/cpuapp
      - nrf54l15dk/nrf54l15/cpuapp
      - nrf54lm20dk/nrf54lm20a/cpuapp
      - nrf54lm20dk/nrf54lm20b/cpuapp
      - ophelia4ev/nrf54l15/cpuapp
      - sltb010a
      - xg23_rb4210a
      - xg24_dk2601b
      - xg24_rb4187c
      - xg27_dk2602a
      - xg29_rb4412a
      - bg29_rb4420a
      - slwrb4180a
      - kg100s_rb4332a
      - ek_ra4c1
      - pic32cx_sg41_cult
      - sam_e54_xpro
      - pic32cm_jh01_cpro
    extra_args:
      - platform:sam_e54_xpro/atsame54p20a:"DTC_OVERLAY_FILE=boards/sam_e54_xpro_ref.overlay"
      - platform:pic32cx_sg41_cult/pic32cx1025sg41128:"DTC_OVERLAY_FILE=boards/pic32cx_sg41_cult_ref.overlay"
    integration_platforms:
      - frdm_kl25z
      - nrf54l15dk/nrf54l15/cpuapp

  # SAADC clock-management coverage (build-only). The SAADC selects a clock state through its
  # `clocks` property: pclk16m_hfint has no producer (no clock action), while pclk16m_hfxo names
  # the HFXO as a producer that the driver requests. The hfxo producer is SoC-specific (HFCLK on
  # nRF5340, the xo node on nRF54L/nRF7120, fll16m with an accuracy spec on nRF54H20), so each SoC
  # uses its own overlay; the (producer-less) hfint overlay is shared. A global EXTRA_DTC_OVERLAY_-
  # FILE is used rather than a platform-prefixed one so it applies regardless of board revision.
  #
  # pclk16m_hfint - no producer, no clock action; shared overlay across all four SoCs.
  drivers.adc.accuracy.clock_mgmt.pclk16m_hfint:
    build_only: true
    extra_configs:
      - CONFIG_REFERENCE_VOLTAGE_TEST=y
    filter: CONFIG_REFERENCE_VOLTAGE_TEST
    platform_allow:
      - nrf5340dk/nrf5340/cpuapp
      - nrf54l15dk/nrf54l15/cpuapp
      - nrf54h20dk/nrf54h20/cpuapp
      - nrf7120dk/nrf7120/cpuapp
    extra_args:
      - EXTRA_DTC_OVERLAY_FILE="boards/adc_pclk16m_hfint.overlay"
    integration_platforms:
      - nrf54l15dk/nrf54l15/cpuapp

  # pclk16m_hfxo - producer requested, default ON_INIT scheme; one scenario per SoC.
  drivers.adc.accuracy.clock_mgmt.pclk16m_hfxo.nrf5340:
    build_only: true
    extra_configs:
      - CONFIG_REFERENCE_VOLTAGE_TEST=y
    filter: CONFIG_REFERENCE_VOLTAGE_TEST
    platform_allow:
      - nrf5340dk/nrf5340/cpuapp
    extra_args:
      - EXTRA_DTC_OVERLAY_FILE="boards/nrf5340dk_nrf5340_cpuapp_pclk16m_hfxo.overlay"

  drivers.adc.accuracy.clock_mgmt.pclk16m_hfxo.nrf54l15:
    build_only: true
    extra_configs:
      - CONFIG_REFERENCE_VOLTAGE_TEST=y
    filter: CONFIG_REFERENCE_VOLTAGE_TEST
    platform_allow:
      - nrf54l15dk/nrf54l15/cpuapp
    extra_args:
      - EXTRA_DTC_OVERLAY_FILE="boards/nrf54l15dk_nrf54l15_cpuapp_pclk16m_hfxo.overlay"

  drivers.adc.accuracy.clock_mgmt.pclk16m_hfxo.nrf54h20:
    build_only: true
    extra_configs:
      - CONFIG_REFERENCE_VOLTAGE_TEST=y
      - CONFIG_CLOCK_CONTROL=y
    filter: CONFIG_REFERENCE_VOLTAGE_TEST
    platform_allow:
      - nrf54h20dk/nrf54h20/cpuapp
    extra_args:
      - EXTRA_DTC_OVERLAY_FILE="boards/nrf54h20dk_nrf54h20_cpuapp_pclk16m_hfxo.overlay"

  drivers.adc.accuracy.clock_mgmt.pclk16m_hfxo.nrf7120:
    build_only: true
    extra_configs:
      - CONFIG_REFERENCE_VOLTAGE_TEST=y
    filter: CONFIG_REFERENCE_VOLTAGE_TEST
    platform_allow:
      - nrf7120dk/nrf7120/cpuapp
    extra_args:
      - EXTRA_DTC_OVERLAY_FILE="boards/nrf7120dk_nrf7120_cpuapp_pclk16m_hfxo.overlay"

  # ON_PM scheme (producer requested on resume, released on suspend). Exercised on nRF54H20 (which
  # also carries an accuracy spec) and nRF54L15 (no spec).
  drivers.adc.accuracy.clock_mgmt.pclk16m_hfxo_on_pm.nrf54h20:
    build_only: true
    extra_configs:
      - CONFIG_REFERENCE_VOLTAGE_TEST=y
      - CONFIG_CLOCK_CONTROL=y
      - CONFIG_PM_DEVICE=y
      - CONFIG_PM_DEVICE_RUNTIME=y
      - CONFIG_ADC_NRFX_SAADC_CLOCK_MGMT_ON_PM=y
    filter: CONFIG_REFERENCE_VOLTAGE_TEST
    platform_allow:
      - nrf54h20dk/nrf54h20/cpuapp
    extra_args:
      - EXTRA_DTC_OVERLAY_FILE="boards/nrf54h20dk_nrf54h20_cpuapp_pclk16m_hfxo.overlay"

  drivers.adc.accuracy.clock_mgmt.pclk16m_hfxo_on_pm.nrf54l15:
    build_only: true
    extra_configs:
      - CONFIG_REFERENCE_VOLTAGE_TEST=y
      - CONFIG_PM_DEVICE=y
      - CONFIG_PM_DEVICE_RUNTIME=y
      - CONFIG_ADC_NRFX_SAADC_CLOCK_MGMT_ON_PM=y
    filter: CONFIG_REFERENCE_VOLTAGE_TEST
    platform_allow:
      - nrf54l15dk/nrf54l15/cpuapp
    extra_args:
      - EXTRA_DTC_OVERLAY_FILE="boards/nrf54l15dk_nrf54l15_cpuapp_pclk16m_hfxo.overlay"

  # ON_ACTIVE scheme (producer requested around each conversion). Same two representative SoCs.
  drivers.adc.accuracy.clock_mgmt.pclk16m_hfxo_on_active.nrf54h20:
    build_only: true
    extra_configs:
      - CONFIG_REFERENCE_VOLTAGE_TEST=y
      - CONFIG_CLOCK_CONTROL=y
      - CONFIG_ADC_ASYNC=y
      - CONFIG_ADC_NRFX_SAADC_CLOCK_MGMT_ON_ACTIVE=y
    filter: CONFIG_REFERENCE_VOLTAGE_TEST
    platform_allow:
      - nrf54h20dk/nrf54h20/cpuapp
    extra_args:
      - EXTRA_DTC_OVERLAY_FILE="boards/nrf54h20dk_nrf54h20_cpuapp_pclk16m_hfxo.overlay"

  drivers.adc.accuracy.clock_mgmt.pclk16m_hfxo_on_active.nrf54l15:
    build_only: true
    extra_configs:
      - CONFIG_REFERENCE_VOLTAGE_TEST=y
      - CONFIG_ADC_ASYNC=y
      - CONFIG_ADC_NRFX_SAADC_CLOCK_MGMT_ON_ACTIVE=y
    filter: CONFIG_REFERENCE_VOLTAGE_TEST
    platform_allow:
      - nrf54l15dk/nrf54l15/cpuapp
    extra_args:
      - EXTRA_DTC_OVERLAY_FILE="boards/nrf54l15dk_nrf54l15_cpuapp_pclk16m_hfxo.overlay"
