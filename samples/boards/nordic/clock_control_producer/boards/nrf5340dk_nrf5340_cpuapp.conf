CONFIG_UART_ASYNC_API=y

# Use the split clock control driver (nordic,nrf-clock-hfclk) rather than the legacy
# CLOCK_CONTROL_NRF, since the showcase acts on the &hfclk producer from the overlay.
CONFIG_CLOCK_CONTROL_NRF=n

# Request HFXO for uart1 while it is resumed, see the overlay for the reference.
CONFIG_PM_DEVICE=y
CONFIG_PM_DEVICE_RUNTIME=y
CONFIG_UART_NRFX_UARTE_CLOCK_MGMT_ON_PM=y
