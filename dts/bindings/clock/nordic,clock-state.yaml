description: |
  Named clock state of a Nordic nRF peripheral clock.

  A clock state describes one valid way for a peripheral to be clocked: the output that
  determines the frequency, and/or a producer that has to be running for the
  peripheral to be clocked that way. The SoC defines every state that its hardware
  supports, and a clock consumer selects one of them with its `clocks` property:

      &uart30 {
              clocks = <&pclk16m_hfxo>;
      };

  Because the state couples the frequency and the producer, a consumer cannot express an
  invalid combination such as a 16 MHz base clock served by a 128 MHz producer.

  A state node is a pure descriptor; it is not backed by a device. Only the producer it
  references is requested at runtime, and only when the consumer driver is configured to
  act on it (see UART_NRFX_UARTE_CLOCK_MGMT for the UARTE driver). A state without a
  producer therefore means "no runtime action": the peripheral keeps the clock that the
  hardware requests automatically.

compatible: "nordic,clock-state"

include: [base.yaml, clock-controller.yaml]

properties:
  "#clock-cells":
    const: 0

  clock-output:
    type: phandle
    description: |
      Clock output that this state is clocked by, as a reference to a node - typically a
      fixed-clock, or a plain bindingless node for an output whose rate is owned by the
      producer (for example an audio "aclk"). It identifies the hardware clock mux position
      for this state and is never acted upon at runtime. If the output node exposes a
      clock-frequency it provides the frequency the peripheral runs at; if it does not, the
      rate is instead taken from the clock-producer of this state.

      Omit it for a state whose producer is a frequency-selectable (DVFS) generator that
      clocks the peripheral directly with no fixed output rail (for example the nRF54H20
      hsfll120). Such a state has no mux position, and the frequency the peripheral runs at
      is the requested operating point given by producer-frequency-hz (or, absent that, the
      producer's own clock-frequency). A state must have a clock-output, a clock-producer,
      or both.

  clock-producer:
    type: phandle
    description: |
      Clock producer that has to be running for this state, as a reference to a
      clock-control producer node backed by a driver (for example &hfclk on the nRF53
      Series or &xo on the nRF54L Series). Omit it for states that need no runtime action.
      Required when clock-output is omitted.

  producer-frequency-hz:
    type: int
    description: |
      Minimum frequency (in Hz) the producer must provide for this state, mapped to the
      frequency field of the nrf_clock_spec passed to nrf_clock_control_request(). Omit to
      leave the frequency unconstrained (the producer keeps its default). Only meaningful
      together with clock-producer.

  producer-accuracy-ppm:
    type: int
    description: |
      Required producer accuracy (in parts-per-million, lower is stricter), mapped to the
      accuracy field of the nrf_clock_spec. A value of 1 selects the best available accuracy
      (NRF_CLOCK_CONTROL_ACCURACY_MAX). For example, on the nRF54H20 fll16m this selects the
      HFXO-bypass source instead of the open-loop default. Omit to leave accuracy
      unconstrained. Only meaningful together with clock-producer.

  producer-precision:
    type: int
    description: |
      Required producer precision, mapped to the precision field of the nrf_clock_spec
      (0 = default, 1 = high). Omit to leave precision at its default. Only meaningful
      together with clock-producer.
