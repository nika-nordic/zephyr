description: Nordic NRFS AudioPLL clock

compatible: "nordic,nrfs-audiopll"

include: base.yaml

properties:
  clock-frequency:
    type: int
    description: |
      Audio PLL output frequency in Hz. This is the preferred property, replacing the
      deprecated frequency. It also advertises the rate to clock consumers that select an
      audio clock state (the aclk signal itself carries no frequency), giving a uniform
      clock-frequency interface across the Nordic audio clock producers (matching auxpll on
      nRF7120 and hfclkaudio on nRF5340).

      See zephyr/include/zephyr/dt-bindings/clock/nrfs-audiopll.h for predefined frequencies.

  frequency:
    type: int
    deprecated: true
    description: |
      Deprecated in favor of clock-frequency. Initial frequency in Hertz. When both this and
      clock-frequency are present, this explicit value takes precedence.

      See zephyr/include/zephyr/dt-bindings/clock/nrfs-audiopll.h for predefined frequencies.
